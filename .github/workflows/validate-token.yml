name: Validate v6.2 Token

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run v6.2 test suite
        run: bash SYMB-FER_6_2/run_tests.sh

      - name: Validate v6.2 protocol file
        run: python3 SYMB-FER_6_2/validate_v6_2.py SYMB-FER_v6.2_PROTOCOL_2026-06-01_1015H.txt
